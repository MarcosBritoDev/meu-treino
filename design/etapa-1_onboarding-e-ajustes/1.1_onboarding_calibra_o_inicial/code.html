<script>
  function selectUnit(btn, unit) {
    const parent = document.getElementById('unit-group');
    const buttons = parent.querySelectorAll('button');
    buttons.forEach(b => {
      b.className = "flex-1 py-2.5 rounded-lg text-on-surface-variant font-label-sm text-[14px] font-semibold text-center hover:bg-surface-container transition-all flex items-center justify-center space-x-1.5";
      b.innerHTML = b.innerHTML.replace(/<span class="material-symbols-outlined text-\[18px\]">check<\/span>/g, '');
    });
    btn.className = "flex-1 py-2.5 rounded-lg bg-tertiary text-on-tertiary font-label-sm text-[14px] font-semibold text-center transition-all shadow-sm flex items-center justify-center space-x-1.5";
    btn.innerHTML = `<span class="material-symbols-outlined text-[18px]">check</span>` + btn.innerHTML;

    // Update plates suffix
    const unitLabels = document.querySelectorAll('.plate-unit');
    unitLabels.forEach(label => {
      label.textContent = unit;
    });
  }

  function selectPlate(btn) {
    const parent = document.getElementById('plate-group');
    const buttons = parent.querySelectorAll('button');
    buttons.forEach(b => {
      b.className = "h-14 rounded-xl bg-surface-container-low text-on-surface-variant font-headline-lg text-[15px] font-semibold flex flex-col items-center justify-center active:scale-95 transition-all";
    });
    btn.className = "h-14 rounded-xl bg-tertiary text-on-tertiary font-headline-lg text-[15px] font-semibold flex flex-col items-center justify-center shadow-sm active:scale-95 transition-all";
  }

  function selectRest(btn) {
    const parent = document.getElementById('rest-group');
    const buttons = parent.querySelectorAll('button');
    buttons.forEach(b => {
      b.className = "h-12 rounded-xl bg-surface-container-low text-on-surface font-headline-lg text-[14px] font-semibold flex items-center justify-center active:scale-95 transition-all";
    });
    btn.className = "h-12 rounded-xl bg-tertiary text-on-tertiary font-headline-lg text-[14px] font-semibold flex items-center justify-center shadow-sm active:scale-95 transition-all";
  }

  function handleStart(btn) {
    btn.innerHTML = `
      <span class="material-symbols-outlined text-[20px] animate-spin">progress_activity</span>
      <span>Configurando treino...</span>
    `;
    btn.disabled = true;
    setTimeout(() => {
      btn.innerHTML = `
        <span class="material-symbols-outlined text-[20px]">check_circle</span>
        <span>Pronto para Treinar!</span>
      `;
    }, 700);
  }
