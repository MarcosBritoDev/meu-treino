<script>
  // Dynamic Selector Interactivity
  document.addEventListener('DOMContentLoaded', () => {
    // Muscle Selection
    const muscleCards = document.querySelectorAll('.muscle-card');
    muscleCards.forEach(card => {
      card.addEventListener('click', () => {
        muscleCards.forEach(c => {
          c.className = "muscle-card flex flex-col items-center justify-center h-[90px] rounded-xl p-2 bg-surface-container text-on-surface-variant hover:bg-surface-container-high active:scale-95 transition-all";
          const icon = c.querySelector('.material-symbols-outlined');
          if (icon) icon.style.fontVariationSettings = "'FILL' 0";
          const text = c.querySelector('span:last-child');
          if (text) text.className = "font-label-sm text-label-sm font-semibold tracking-tight text-on-surface";
        });
        card.className = "muscle-card flex flex-col items-center justify-center h-[90px] rounded-xl p-2 bg-tertiary text-on-tertiary shadow-md transition-all active:scale-95";
        const activeIcon = card.querySelector('.material-symbols-outlined');
        if (activeIcon) activeIcon.style.fontVariationSettings = "'FILL' 1";
        const activeText = card.querySelector('span:last-child');
        if (activeText) activeText.className = "font-label-sm text-label-sm font-semibold tracking-tight text-on-tertiary";
      });
    });

    // Equipment Selection
    const eqChips = document.querySelectorAll('.eq-chip');
    eqChips.forEach(chip => {
      chip.addEventListener('click', () => {
        eqChips.forEach(c => {
          c.className = "eq-chip px-4 py-2.5 rounded-full bg-surface-container text-on-surface font-label-sm text-label-sm font-medium hover:bg-surface-container-high transition-all active:scale-95";
          const check = c.querySelector('.material-symbols-outlined');
          if (check) check.remove();
        });
        chip.className = "eq-chip px-4 py-2.5 rounded-full bg-tertiary text-on-tertiary font-label-sm text-label-sm font-semibold flex items-center gap-1.5 shadow-sm transition-all active:scale-95";
        if (!chip.querySelector('.material-symbols-outlined')) {
          const icon = document.createElement('span');
          icon.className = "material-symbols-outlined text-[18px]";
          icon.innerText = "check";
          chip.prepend(icon);
        }
      });
    });

    // Weight Increment Selection
    const weightChips = document.querySelectorAll('.weight-chip');
    const weightLabel = document.getElementById('weight-label');
    weightChips.forEach(chip => {
      chip.addEventListener('click', () => {
        weightChips.forEach(c => c.className = "weight-chip py-2 rounded-lg bg-surface-container-high text-on-surface font-label-sm text-label-sm font-semibold text-center transition-all active:scale-95");
        chip.className = "weight-chip py-2 rounded-lg bg-tertiary text-on-tertiary font-label-sm text-label-sm font-semibold text-center shadow-sm transition-all active:scale-95";
        if (weightLabel) weightLabel.innerText = chip.dataset.val;
      });
    });

    // Rest Increment Selection
    const restChips = document.querySelectorAll('.rest-chip');
    const restLabel = document.getElementById('rest-label');
    restChips.forEach(chip => {
      chip.addEventListener('click', () => {
        restChips.forEach(c => c.className = "rest-chip py-2 rounded-lg bg-surface-container-high text-on-surface font-label-sm text-label-sm font-semibold text-center transition-all active:scale-95");
        chip.className = "rest-chip py-2 rounded-lg bg-tertiary text-on-tertiary font-label-sm text-label-sm font-semibold text-center shadow-sm transition-all active:scale-95";
        if (restLabel) restLabel.innerText = chip.dataset.val;
      });
    });

    // Submit Animation feedback
    const submitBtn = document.getElementById('submit-exercise');
    submitBtn.addEventListener('click', () => {
      submitBtn.innerHTML = '<span class="material-symbols-outlined text-[22px] animate-spin">refresh</span> Salvando...';
      setTimeout(() => {
        submitBtn.className = "w-full py-4 px-6 rounded-full bg-primary text-on-primary font-headline-lg text-body-md font-semibold flex items-center justify-center gap-2 shadow-lg transition-all";
        submitBtn.innerHTML = '<span class="material-symbols-outlined text-[22px]">task_alt</span> Exercício criado!';
      }, 700);
    });
  });
</script></main>
